aid: pointee
name: Pointee
description: >-
  Pointee is an agentic automation platform for enterprise business process
  automation, guiding organizations through the full automation journey from
  discovery to running AI at scale. Its Process Discovery maps how work actually
  runs to surface automation potential and ROI, Workflow Automation orchestrates
  people, bots, and AI agents in unified workflows, and Guardian Agents
  continuously monitor automation to detect quality drops, automate incident
  response, and prevent cost overruns and security threats. Pointee also offers a
  dedicated offering to maximize existing RPA investments. The product is
  operated by Pointee Interactive s.r.o. (Liberec, Czech Republic) and is a
  portfolio company of Earlybird; customers include KBC, Intel, Deloitte, AXA,
  Microsoft, and Mutual of Omaha.
